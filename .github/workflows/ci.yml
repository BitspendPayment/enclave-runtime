name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two pushes to one pull request used to run two complete fans to completion,
# and only the second was ever read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Four stages, each a checkout, a toolchain, and one script. The scripts are the
# recipes: they live in scripts/ so a job can be run locally with the same
# command CI uses, and so deploy/qemu-nitro/run-e2e.sh can share them instead of
# keeping a second copy that has to agree.
#
# There are deliberately no `needs:` edges. Gating the long jobs behind the
# short one would put its minutes on the front of the critical path to save
# runner time only on runs that were failing anyway; cancel-in-progress above
# removes the waste that actually dominates, which is superseded runs.
jobs:
  unit:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          shared-key: host
      - run: scripts/ci-check.sh

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Writing the tracked history back to gh-pages on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          shared-key: guests
          workspaces: |
            . -> target
            examples/guest-http -> target
      - run: scripts/ci-bench.sh

      - uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # History is written only from main. A pull request compares against
          # it and says so in the log, but must not rewrite the baseline.
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          save-data-file: ${{ github.ref == 'refs/heads/main' }}
          # A shared runner's neighbours move these numbers more than most
          # commits do, so a regression is reported and never fails the build.
          # Tightening this is worth doing once there is enough history to know
          # what the noise floor actually is.
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false

  # There is deliberately no SQLite job. The runtime measures its guest into
  # PCR16 before it will serve, and that reads the NSM — which a hosted runner
  # does not have, so the binary refuses to start there at all. The workload
  # lives on in scripts/ci-sqlite.sh for a machine with an enclave.
  e2e:
    name: the whole stack, in an emulated enclave
    runs-on: ubuntu-latest
    # The integration suites, then a cold Nix build of the image, then the
    # emulated boot. This is the only integration signal, so it carries the
    # suites that used to have their own job.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: ./.github/actions/rust
        with:
          shared-key: guests
          workspaces: |
            . -> target
            examples/guest-http -> target
            examples/guest-grpc -> target
      - uses: actions/cache@v4
        with:
          path: target/qemu-nitro/tools
          # The pinned version lives in the script, so the key follows the
          # script rather than being a second place to update.
          key: vhost-device-vsock-${{ hashFiles('scripts/ci-e2e.sh') }}
      - run: scripts/ci-e2e.sh
        env:
          # A runner boots the emulated enclave more slowly than a workstation,
          # and the default is tuned for the latter.
          TIMEOUT: 480
      # Nested virtualisation on hosted runners works but is not something
      # GitHub supports, so this is the job most likely to fail for reasons
      # outside this repository. Its logs are the only way to tell that apart
      # from a real regression.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            target/qemu-nitro/e2e/*.log
          if-no-files-found: ignore
