[workspace]

[package]
name = "guest-smoke"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal wasm32-wasip2 guest exercising wasi:filesystem and wasi:cli/environment"

[[bin]]
name = "guest-smoke"
path = "src/main.rs"

# Deliberately no dependencies. guest-fsdemo needs wasi-sdk to build its
# bundled SQLite; this one builds with nothing but a Rust toolchain and the
# wasm32-wasip2 target, so it can run on every CI push rather than only where
# a 100 MB C toolchain has been installed.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
