[workspace]
resolver = "2"
members = [
    "crates/nitro-attestation",
    "crates/nitro-nsm",
    "runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BitspendPayment/enclave-runtime"

[workspace.dependencies]
tokio       = { version = "1", default-features = false }
bytes       = "1"
tracing     = "0.1"
thiserror   = "1"
anyhow      = "1"
async-trait = "0.1"
futures     = "0.3"
parking_lot = "0.12"
siphasher   = "1"

# Scrubs key material on drop. Enclave memory is unreadable from outside, but
# key bytes should not outlive their use inside it either.
zeroize     = { version = "1", features = ["zeroize_derive"] }
# The anchor chain's hashes and the boot's state root.
blake3      = "1"
# AES-256-GCM, Ed25519 anchor signatures, HKDF key derivation. aws-lc-rs is
# the AWS-native, FIPS-capable stack — the same primitives KMS speaks.
aws-lc-rs   = { version = "1", default-features = false, features = ["aws-lc-sys"] }

aws-config             = { version = "1", default-features = false }
aws-sdk-s3             = { version = "1", default-features = false }
aws-smithy-runtime-api = "1"
aws-smithy-types       = "1"

wasmtime      = { version = "=44.0.0", default-features = false, features = ["component-model", "async", "runtime"] }
wasmtime-wasi = "=44.0.0"

[profile.release]
lto = "thin"
codegen-units = 1
