[package]
name = "s3fs-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasi:filesystem over s3fs-core, plus the linker and run loop a host needs"

[features]
default = []
# Mounting an S3-backed filesystem. Off by default so the wasi:filesystem
# bindings stay usable over any Backend without pulling in the AWS SDK.
aws = ["s3fs-core/aws"]

[dependencies]
s3fs-core  = { path = "../s3fs-core" }
nitro-nsm  = { path = "../nitro-nsm" }

# The host compiles components, so it needs cranelift on top of the runtime.
wasmtime         = { version = "=44.0.0", features = ["component-model", "async", "runtime", "cranelift", "std"] }
wasmtime-wasi    = { workspace = true }
wasmtime-wasi-io = "=44.0.0"

# The PTP clock is read through the POSIX dynamic-clock mechanism. rustix is
# already compiled into the tree via wasmtime, so this adds no build cost and
# avoids a direct libc dependency.
rustix      = { version = "1", features = ["time", "fs"] }
# Pinned to whatever `wasmtime-wasi` accepts for `secure_random`, which is
# cap-rand's re-export of rand 0.8 — not a version to guess at.
cap-rand    = "3"
getrandom   = "0.3"

anyhow      = { workspace = true }
async-trait = { workspace = true }
bytes       = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "macros"] }
tracing     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros"] }
nitro-nsm = { path = "../nitro-nsm", features = ["testing"] }
