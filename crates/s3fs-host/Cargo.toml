[package]
name = "s3fs-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasi:filesystem over s3fs-core, plus the linker and run loop a host needs"

[features]
default = []
# Mounting an S3-backed filesystem. Off by default so the wasi:filesystem
# bindings stay usable over any Backend without pulling in the AWS SDK.
aws = ["s3fs-core/aws"]
# Serving a `wasi:http/proxy` guest. Off by default because it drags in hyper
# and a second copy of the HTTP machinery, which a host embedding only
# `wasi:filesystem` has no use for.
serve = [
    "dep:wasmtime-wasi-http",
    "dep:hyper",
    "dep:http",
    "dep:http-body-util",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rcgen",
    "dep:nitro-attestation",
    "dep:base64",
    "dep:hex",
    "tokio/net",
    "tokio/io-util",
]

[dependencies]
s3fs-core  = { path = "../s3fs-core" }
nitro-nsm  = { path = "../nitro-nsm" }

# The host compiles components, so it needs cranelift on top of the runtime.
wasmtime         = { version = "=44.0.0", features = ["component-model", "async", "runtime", "cranelift", "std"] }
wasmtime-wasi    = { workspace = true }
wasmtime-wasi-io = "=44.0.0"

# `default-send-request` is deliberately OFF. With it on, `wasi:http`'s
# outgoing-handler quietly gains a working implementation — a guest could make
# arbitrary outbound requests, through a second rustls and its own root store,
# neither of which anything here configures. With it off, `send_request`
# becomes a trait method we are *required* to write, so refusing egress is a
# visible decision rather than a feature flag nobody looked at. See
# `serve::EgressPolicy`.
wasmtime-wasi-http = { version = "=44.0.0", default-features = false, features = ["p2"], optional = true }
hyper          = { version = "1", features = ["http1", "server"], optional = true }
http           = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# aws-lc-rs, not ring: it is already the crypto stack for the block store's
# AEAD, signatures and key derivation, and a second one would mean two
# implementations of the same primitives inside one attested image.
rustls         = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"], optional = true }
tokio-rustls   = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"], optional = true }
rcgen          = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }
nitro-attestation = { path = "../nitro-attestation", optional = true }
base64         = { version = "0.22", optional = true }
hex            = { version = "0.4", optional = true }

# The PTP clock is read through the POSIX dynamic-clock mechanism. rustix is
# already compiled into the tree via wasmtime, so this adds no build cost and
# avoids a direct libc dependency.
rustix      = { version = "1", features = ["time", "fs"] }
# Pinned to whatever `wasmtime-wasi` accepts for `secure_random`, which is
# cap-rand's re-export of rand 0.8 — not a version to guess at.
cap-rand    = "3"
getrandom   = "0.3"

anyhow      = { workspace = true }
async-trait = { workspace = true }
bytes       = { workspace = true }
tokio       = { workspace = true, features = ["sync", "rt", "macros"] }
tracing     = { workspace = true }

[dev-dependencies]
# Checking that a generated certificate really parses as X.509.
x509-parser = "0.18"
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros"] }
nitro-nsm = { path = "../nitro-nsm", features = ["testing"] }
# Builds genuinely signed attestation documents for the TLS binding tests.
nitro-attestation = { path = "../nitro-attestation", features = ["testing"] }
hex = "0.4"
base64 = "0.22"
